name: Release (reusable)

# Reusable release pipeline. Callers decide WHEN + at WHAT version; this defines HOW we
# build, sign, publish, and verify. The job checks out the CALLER's repo (default
# actions/checkout in a reusable workflow), so goreleaser builds the caller's code and
# the caller's e2e_script is present. The install-smoke is INLINED (not a script file)
# because a central release-ci/test/*.sh would be absent from the caller's checkout.

on:
  workflow_call:
    inputs:
      version:
        description: "Tag/version to release (e.g. v0.6.1); the tag already exists."
        required: true
        type: string
      goreleaser_config:
        required: false
        type: string
        default: .goreleaser.yaml
      project_name:
        description: "GoReleaser project_name; drives dist/<project_name>_* artifact names."
        required: true
        type: string
      package_name:
        description: "apt/dnf/brew install identity. Empty → resolved to project_name."
        required: false
        type: string
        default: ""
      binary:
        description: "Installed binary name, for the smoke --version check."
        required: true
        type: string
      cloudsmith_repo:
        required: false
        type: string
        default: rocne/releases
      language:
        required: false
        type: string
        default: go
      e2e_script:
        description: "Path (caller-relative) to a tool-specific post-release test; empty = skip."
        required: false
        type: string
        default: ""
      smoke_distros:
        description: "JSON array of {image, mgr} for the install-smoke matrix."
        required: false
        type: string
        default: '[{"image":"ubuntu:24.04","mgr":"apt"},{"image":"fedora:41","mgr":"dnf"}]'

permissions:
  contents: write
  issues: write

# Opt JS actions into Node 24 ahead of the forced migration. Safe no-op once default.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Non-bypassable vendored-installer gate (D37). The caller's repo-root install.sh
  # must match this release-ci's canonical installer outside the config block, or
  # the release is blocked before anything is signed (`release` needs: this job).
  # A consumer cannot ship a drifted, signature-skipping installer under the
  # rocne/release-ci signing identity: the only way past the gate is to stop
  # calling the pipeline, which forfeits that identity. The consumer's own ci.yml
  # `installer-drift` job (D36) stays as fast per-push feedback; this is the
  # enforceable floor. Residual: this gates at release time only — a drifted
  # install.sh sitting on raw-on-`main` *between* releases (the file users
  # curl | sh) is out of scope here, a continuous-verification problem.
  installer-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the caller repo (its vendored install.sh)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same self-consistent fetch as the Cloudsmith requirements below: the
      # canonical installer + the drift assertion at the EXACT release-ci SHA
      # executing here — the tag the caller pinned — never a mutable ref. The
      # assert script resolves its default canonical to installer/install.sh in
      # its own (this) tree, so both paths are checked out together.
      - name: Fetch canonical installer + drift assertion from pinned release-ci
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-ci
          persist-credentials: false
          sparse-checkout: |
            release-dryrun/assert-vendored-installer.sh
            installer/install.sh
          sparse-checkout-cone-mode: false

      - name: Assert vendored install.sh has not drifted from canonical
        run: sh .release-ci/release-dryrun/assert-vendored-installer.sh ./install.sh

  release:
    needs: installer-drift
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        if: inputs.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Prepare package signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s' "$GPG_PRIVATE_KEY" > "$RUNNER_TEMP/signing-key.asc"
          echo "GPG_KEY_PATH=$RUNNER_TEMP/signing-key.asc" >> "$GITHUB_ENV"

      # This job checks out the CALLER's repo, so release-ci's own requirements file is
      # absent here (same reason the install-smoke is inlined). Fetch it from the exact
      # SHA of the reusable workflow that is executing — self-consistent, no mutable ref.
      - name: Fetch pinned Cloudsmith CLI requirements
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-ci
          persist-credentials: false
          sparse-checkout: requirements-cloudsmith.txt
          sparse-checkout-cone-mode: false

      # Hash-pinned per D18 (#4): --require-hashes closes the whole transitive tree, not
      # just the top-level pin. Plain venv, not pipx: pipx applies --pip-args to its own
      # shared-libs pip upgrade too, which --require-hashes then rejects (verified).
      - name: Install Cloudsmith CLI
        run: |
          python3 -m venv "$RUNNER_TEMP/cloudsmith-cli"
          "$RUNNER_TEMP/cloudsmith-cli/bin/pip" install --require-hashes -r .release-ci/requirements-cloudsmith.txt
          echo "$RUNNER_TEMP/cloudsmith-cli/bin" >> "$GITHUB_PATH"
          rm -rf .release-ci

      - name: Release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          # Exact pin (D29/D24 counter-offer). No bot advances this one — bump by hand.
          version: v2.17.0
          args: release --config ${{ inputs.goreleaser_config }} --clean --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ inputs.version }}
          VERSION: ${{ inputs.version }}
          GPG_KEY_PATH: ${{ env.GPG_KEY_PATH }}
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
          CLOUDSMITH_REPO: ${{ inputs.cloudsmith_repo }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/${{ inputs.project_name }}_*.tar.gz

  verify:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify release signature and provenance
        run: |
          TAG="${{ inputs.version }}"
          BASE="https://github.com/${{ github.repository }}/releases/download/$TAG"
          CHECKSUMS="${{ inputs.project_name }}_${TAG}_checksums.txt"
          ARCHIVE="${{ inputs.project_name }}_${TAG}_linux_amd64.tar.gz"
          curl -fsSL -o "$CHECKSUMS"               "$BASE/$CHECKSUMS"
          curl -fsSL -o "$CHECKSUMS.sigstore.json" "$BASE/$CHECKSUMS.sigstore.json"
          curl -fsSL -o "$ARCHIVE"                 "$BASE/$ARCHIVE"
          # cosign v3 signs into a single Sigstore bundle (both signature and
          # Fulcio cert); verify with --bundle, not the old --certificate/--signature.
          cosign verify-blob \
            --bundle "$CHECKSUMS.sigstore.json" \
            --certificate-identity-regexp "^https://github\.com/rocne/release-ci/\.github/workflows/release\.yml@refs/tags/v" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$CHECKSUMS"
          # The SLSA attestation is signed by THIS reusable workflow's identity
          # (Fulcio SAN = the reusable workflow, not the caller), so the signer
          # must be pinned explicitly — same gotcha as the cosign identity above.
          gh attestation verify "$ARCHIVE" \
            --repo "${{ github.repository }}" \
            --signer-workflow rocne/release-ci/.github/workflows/release.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open issue on failure
        if: failure()
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "release verify failure: ${{ inputs.version }}" \
            --body "Signature/provenance verification failed for [${{ inputs.version }}](https://github.com/${{ github.repository }}/releases/tag/${{ inputs.version }}). Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  package-repo-smoke:
    needs: release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.smoke_distros) }}
    container: ${{ matrix.image }}
    steps:
      - name: Install from the Cloudsmith repo and verify
        env:
          MGR: ${{ matrix.mgr }}
          PKG: ${{ inputs.package_name || inputs.project_name }}
          REPO_SLUG: ${{ inputs.cloudsmith_repo }}
          BINARY: ${{ inputs.binary }}
          VERSION: ${{ inputs.version }}
        # Force bash: the matrix container's default shell is `sh` (dash on
        # ubuntu), which rejects `set -o pipefail`. bash is present in the
        # apt/dnf base images this smoke targets.
        shell: bash
        run: |
          set -euxo pipefail
          VER="${VERSION#v}"
          case "$MGR" in
            apt)
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y curl sudo
              curl -1sLf "https://dl.cloudsmith.io/public/${REPO_SLUG}/setup.deb.sh" | bash
              for i in 1 2 3 4 5; do
                { apt-get update && apt-get install -y "$PKG" && break; } \
                  || { echo "retry $i: $PKG not in index yet"; sleep 15; }
              done
              ;;
            dnf)
              dnf install -y curl sudo
              curl -1sLf "https://dl.cloudsmith.io/public/${REPO_SLUG}/setup.rpm.sh" | bash
              for i in 1 2 3 4 5; do
                dnf install -y "$PKG" && break \
                  || { echo "retry $i: $PKG not in index yet"; sleep 15; }
              done
              ;;
            *)
              echo "unknown MGR: $MGR (expected apt or dnf)" >&2
              exit 2
              ;;
          esac
          command -v "$BINARY"
          "$BINARY" --version
          # D30 (#15): the tool's own version is the first semver-shaped token on
          # line 1 of `--version`. Here the tag is known, so we make the stronger
          # equals-version check (VER is already v-stripped, above); the tag-
          # agnostic parse rule itself is asserted in each consumer's release-
          # dryrun via assert-version-contract.sh. This supersedes the old
          # substring grep, which matched the version anywhere on any line.
          line1="$("$BINARY" --version 2>&1 | head -n1)"
          got="$(printf '%s\n' "$line1" | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)*' | head -n1 || true)"
          if [ "${got#v}" != "$VER" ]; then
            echo "::error::D30 --version parse rule: '$BINARY --version' line 1 reports '${got:-<none>}', expected '$VER'"
            echo "  first line: $line1"
            exit 1
          fi
          echo "D30 --version parse rule: OK ($BINARY $got)"

  e2e:
    needs: release
    if: inputs.e2e_script != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run e2e (${{ inputs.e2e_script }})
        run: bash "${{ inputs.e2e_script }}"
        env:
          VERSION: ${{ inputs.version }}

      - name: Open issue on failure
        if: failure()
        run: |
          gh issue create \
            --title "e2e failure: ${{ inputs.version }}" \
            --body "e2e failed for [${{ inputs.version }}](https://github.com/${{ github.repository }}/releases/tag/${{ inputs.version }}). Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
