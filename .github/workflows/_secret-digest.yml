name: _secret-digest (temp)

# TEMP diagnostic — DELETE after use.
# Prints truncated HMAC-SHA256 digests of the three release secrets so the
# org-level values (release-ci has no repo override → these resolve to the ORG
# secret) can be compared byte-for-byte against dot-dagger's known-good
# repo-level values. Prints DIGESTS ONLY, never the secret values.

on:
  workflow_dispatch:

permissions: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Print secret digests (not values)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          for s in GPG_PRIVATE_KEY CLOUDSMITH_API_KEY HOMEBREW_TAP_GITHUB_TOKEN; do
            eval v=\$$s
            if [ -z "$v" ]; then echo "$s: MISSING"; continue; fi
            printf '%s' "$v" | openssl dgst -sha256 -hmac "compare-salt-v1" -r \
              | cut -c1-16 | sed "s/^/$s: /"
          done
