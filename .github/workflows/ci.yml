# release-ci's own CI: lint and test the canonical installer.
# Named ci.yml, not release.yml — consumers already have break-glass workflows
# named release.yml and the collision is confusing (issue #1, open question 4).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck installer/install.sh installer/snippet.sh release-dryrun/assert-artifact-shape.sh release-dryrun/assert-version-contract.sh release-dryrun/assert-vendored-installer.sh .githooks/pre-commit

  # Secret scan, full history, every ref (adoption audit row 19). The bare
  # pinned binary, not gitleaks/gitleaks-action: the action wrapper requires a
  # paid license on organization accounts, which would couple this gate to a
  # purchase at org-migration time (§9/#11); the binary is MIT and couples to
  # nothing. Full-history-every-run beats diff-scanning here: the repos are
  # small (the largest scans in ~1s) and it re-verifies the whole exposure
  # surface on every push, not just the delta.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history — the scan walks every commit
          persist-credentials: false
      - name: Download gitleaks (pinned, checksum-verified)
        run: |
          curl -fsSL --proto '=https' --tlsv1.2 -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan full history for secrets
        run: ./gitleaks git . --redact --no-banner --log-opts="--all"

  installer-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [bash, dash] # curl … | sh is dash on Debian/Ubuntu (D17)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bats-core/bats-core
          ref: 713504bc0224a19b3d7c7958c18dc07f64f54b44 # v1.12.0
          path: .bats-core
          persist-credentials: false

      # cosign, so the suite exercises the verified-signature path (F5); the
      # cosign-absent path runs wherever cosign isn't installed.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Run the installer suite under ${{ matrix.shell }}
        run: SUT_SHELL=${{ matrix.shell }} ./.bats-core/bin/bats tests/
